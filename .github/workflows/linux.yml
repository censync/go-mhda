name: linux

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.18',  '1.20', '1.21', 'stable' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Display Go version
        run: go version
      - name: Vet
        run: go vet ./...
      - name: Test with the Go CLI
        run: go test ./...

  check:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Race detector
        run: go test -race ./...
      - name: Fuzz (30s per target)
        run: |
          for target in FuzzParseURN FuzzParseNSS FuzzDerivationPath; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime=30s .
          done
